# Общие токены интерфейса. На ранее объявленную метрику можно сослаться как
# $section.key, например: horizontalMargin = $common.spacing.
[common]
spacing = 10
baseFontSize = 15
panelRadius = 8
panelShadowRadius = 4

[dock]
groupHeight = 48
panelHeight = 48
bottomMargin = 20
triggerHeight = 8
panelHorizontalMargin = 12
panelPadding = 0
iconSlotSize = 46
iconSize = 44
iconSpacing = 22
hoverSpacing = 33
iconPressOffset = 8
iconTopOverflow = 16
iconBottomOverflow = 16
activeWorkspaceGap = 33
activeWorkspacePadding = 12
iconHoverScale = 1.5
iconRasterOversample = 1.1
dockCloseDelayMs = 1128

[statusBar]
statusBarHeight = 36
statusBarLogoHeight = 96
statusBarHorizontalMargin = $common.spacing
statusBarWidgetSpacing = $common.spacing
statusBarFontSize = $common.baseFontSize
statusBarWidgetIconSize = 20

[popup]
popupRowSpacing = 8

[appLauncher]
appLauncherColumns = 8
appLauncherVisibleRows = 4
appLauncherIconSize = 64
appLauncherIconSafeZone = $common.spacing
appLauncherFontSize = 14
appLauncherSearchCascadeDelayMs = 32
appLauncherFolderTitleFontSize = 18
appLauncherScrollFadeStrength = 0.64
appLauncherScrollFadeRadius = 48
appLauncherWheelScrollRows = 2
appLauncherDragAutoScrollRowsPerSecond = 6
appLauncherOverscrollDistance = 128

[preview]
previewWidth = 440
previewHeight = 248
previewTitleHeight = 30

[motion]
durationMs = 512
quickDurationMs = 256
springStartScale = 0.08
springOvershoot = 0.16
bezierCurve = 0.05, 0.9, 0.1, 1.05, 1, 1
